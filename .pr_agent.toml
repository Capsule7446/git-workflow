[config]
model = "gpt-5.6-sol"
fallback_models = ["gpt-5.5"]
custom_model_max_tokens = 128000
response_language = "zh-CN"

[pr_reviewer]
extra_instructions = "请用中文进行 PR Review。此 repo 聚焦 Git、worktree、发布工作流，重点检查命令是否安全可逆、分支/提交/同步流程是否准确、平台适配差异、异常恢复路径、自动化脚本风险、文档可操作性和可维护性。"

[pr_description]
extra_instructions = "请用中文总结 PR 变更。"

[pr_code_suggestions]
extra_instructions = "请用中文给出代码改进建议。"
